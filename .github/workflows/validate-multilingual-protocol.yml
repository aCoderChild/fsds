name: Validate multilingual protocol
on:
  push:
    branches: [main]
    paths:
      - 'scripts/validate_multilingual_protocol.py'
      - '.github/workflows/validate-multilingual-protocol.yml'
      - 'notebooks/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests
      - name: Validate full 3K source provenance, split logic, language protocol
        run: python scripts/validate_multilingual_protocol.py
