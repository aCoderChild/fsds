name: Progress multilingual Kaggle experiments
on:
  push:
    branches: [main]
    paths: ['.github/workflows/progress-multilingual-kaggle.yml']
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kaggle-sequential-experiment-orchestrator
  cancel-in-progress: false

jobs:
  progress:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Kaggle CLI
        run: python -m pip install --upgrade kaggle
      - name: Inspect completed outputs and advance at most one research stage
        run: python scripts/orchestrate_kaggle.py
      # This workflow also doubles as a read-only status check while stage 01 runs.

# Snapshot status check after 6-language NLLB translation began.
