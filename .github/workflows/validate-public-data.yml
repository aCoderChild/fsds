name: Validate public MQuAKE sources
on:
  push:
    branches: [main]
    paths:
      - 'scripts/validate_public_sources.py'
      - '.github/workflows/validate-public-data.yml'
      - 'notebooks/01_mquake_t_source_translate_sft.ipynb'
  workflow_dispatch:

permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install source loader dependency
        run: python -m pip install requests
      - name: Validate REAL benchmark rows and split integrity (CPU only)
        run: python scripts/validate_public_sources.py
