name: Kaggle notebooks
on:
  push:
    branches: [main]
    paths:
      - 'notebooks/**'
      - '.github/workflows/kaggle-notebooks.yml'
  workflow_dispatch:
    inputs:
      stage:
        description: 'Choose one notebook stage, or all for uploading drafts'
        type: choice
        required: true
        default: all
        options:
          - all
          - '01'
          - '02'
          - '03'
      execute:
        description: 'Actually RUN on Kaggle GPU? Default is safe upload-only.'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: kaggle-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Kaggle CLI
        run: python -m pip install --upgrade 'kaggle>=1.7.4'
      - name: Check credentials supplied
        shell: bash
        run: |
          test -n "$KAGGLE_USERNAME" || { echo 'Missing KAGGLE_USERNAME Actions secret'; exit 1; }
          if [[ -z "$KAGGLE_API_TOKEN" && -z "$KAGGLE_KEY" ]]; then
            echo 'Missing Kaggle credentials. Recommended: add KAGGLE_API_TOKEN GitHub Actions secret.'
            echo 'Legacy alternative: set KAGGLE_USERNAME and KAGGLE_KEY from the same kaggle.json.'
            exit 1
          fi
          if [[ -z "$KAGGLE_API_TOKEN" && "$KAGGLE_KEY" == KGAT_* ]]; then
            echo 'KAGGLE_KEY contains a new-style Kaggle API token. Move it to the KAGGLE_API_TOKEN Actions secret.'
            exit 1
          fi
          if [[ -n "$KAGGLE_API_TOKEN" ]]; then
            echo 'Using the KAGGLE_API_TOKEN authentication method.'
          else
            echo 'Using the legacy Kaggle username/key authentication method.'
          fi
      - name: Verify Kaggle API authentication (without showing secrets)
        shell: bash
        run: |
          if ! kaggle quota; then
            echo 'Kaggle authentication failed before uploading anything.'
            echo 'Regenerate an API token at https://www.kaggle.com/settings/api'
            echo 'Save only its value in the GitHub Actions secret KAGGLE_API_TOKEN.'
            echo 'Do not paste your token into logs, issues, notebooks, or chat.'
            exit 1
          fi
      - name: Validate notebooks
        run: python scripts/check_notebooks.py
      - name: Publish private Kaggle kernels
        env:
          STAGE: ${{ github.event_name == 'push' && 'all' || inputs.stage }}
          EXECUTE: ${{ github.event_name == 'push' && 'false' || inputs.execute }}
        shell: bash
        run: |
          if [[ "$EXECUTE" == "true" ]]; then
            python scripts/publish_kaggle.py --stage "$STAGE" --execute
          else
            python scripts/publish_kaggle.py --stage "$STAGE"
          fi
      - name: Report Kaggle links
        if: success()
        shell: bash
        env:
          STAGE: ${{ github.event_name == 'push' && 'all' || inputs.stage }}
        run: |
          case "$STAGE" in
            all) set -- '01' '02' '03' ;;
            *) set -- "$STAGE" ;;
          esac
          for n in "$@"; do
            case "$n" in
              '01') slug='mquake-real-01-source-translation-sft' ;;
              '02') slug='mquake-real-02-unlearning' ;;
              '03') slug='mquake-real-03-evaluation' ;;
            esac
            echo "Notebook: https://www.kaggle.com/code/$KAGGLE_USERNAME/$slug"
          done
